services:
  mysql:
    image: mysql:8.4
    container_name: clinica_mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - clinica_net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        BACKEND_REPO: ${BACKEND_REPO}
    container_name: clinica_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PYTHONUNBUFFERED: 1
    command: >
      sh -c "if [ -f /app/main.py ]; then uvicorn main:app --host 0.0.0.0 --port 8000;
      elif [ -f /app/app/main.py ]; then uvicorn app.main:app --host 0.0.0.0 --port 8000;
      else echo 'Impossibile trovare il punto di ingresso FastAPI (main.py o app/main.py).' >&2; exit 1; fi"
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - clinica_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        FRONTEND_REPO: ${FRONTEND_REPO}
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: clinica_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - clinica_net

volumes:
  mysql_data:

networks:
  clinica_net:
    driver: bridge
